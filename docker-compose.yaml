services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    # Используем именованные тома вместо bind mounts
    volumes:
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
      - /home/diversapc/zigbee-vr/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro



  zigbee2mqtt:
    image: koenkk/zigbee2mqtt:latest
    container_name: zigbee2mqtt
    restart: unless-stopped
    ports:
      - "8081:8081"
    devices:
      - "/dev/ttyUSB0:/dev/ttyUSB0"
    # Используем именованные тома
    volumes:
      - /mnt/d/zigbee-vr/zigbee2mqtt/data:/app/data
    # Конфигурацию зашиваем в образ или копируем
    environment:
      - TZ=Europe/Moscow
    depends_on:
      - mosquitto

  
  vr_api:
    image: python:3.12-slim
    container_name: vr_api
    working_dir: /app
    volumes:
      - ./vr_api:/app
    environment:
      - MQTT_HOST=mosquitto
      - MQTT_PORT=1883
      - MQTT_BASE_TOPIC=zigbee2mqtt
    command: >
      sh -lc "pip install --no-cache-dir fastapi uvicorn paho-mqtt &&
              uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      - mosquitto


volumes:
  mosquitto_data:
  mosquitto_log: